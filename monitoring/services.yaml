    #     server: my-docker
    #     container: music-assistant

    - Voice AI:
        - Linux Voice Assistant:
            icon: mdi-microphone
            description: Home Assistant voice satellite
            server: my-docker
            container: linux-voice-assistant

        - Whisper English:
            icon: mdi-waveform
            description: English speech-to-text
            server: my-docker
            container: wyoming-whisper-en

        - Piper:
            icon: mdi-volume-high
            description: Local text-to-speech
            server: my-docker
            container: wyoming-piper
