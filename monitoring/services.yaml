- Infrastructure:
    - Homepage:
        icon: homepage.png
        href: http://192.168.29.239:3000
        description: Home server dashboard
        server: my-docker
        container: homepage
    - Home Server:
        icon: mdi-laptop
        description: Debian home server
        widget:
          type: homeassistant
          url: http://192.168.29.239:8123
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - state: sensor.server_battery
              label: Battery
            - state: sensor.server_battery_status
              label: Power
    - Diun:
        icon: mdi-update
        description: Container update monitor
        server: my-docker
        container: diun
    - AdGuard Home:
        icon: adguard-home.png
        href: http://192.168.29.239:3001
        description: Network DNS filtering
        server: my-docker
        container: adguard
        widget:
          type: adguard
          url: http://192.168.29.239:3001
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields:
            - queries
            - blocked
            - filtered
            - latency
    - Tailscale:
        icon: tailscale.png
        description: Secure remote access
        widget:
          type: tailscale
          deviceid: naw1WcPmgM11CNTRL
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
          fields:
            - address
            - last_seen
            - update_available
            - expires






- Backup:
    - Restic Backup:
        icon: mdi-cloud-check
        description: Nightly backup to Backblaze B2
        widget:
          type: customapi
          url: http://host.docker.internal:8765/restic-status.json 
          refreshInterval: 60000
          mappings:
            - field: status
              label: Status
            - field: last_backup
              label: Last Backup
              format: date
              dateStyle: short
              timeStyle: short
            - field: snapshot
              label: Snapshot
