services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: unless-stopped
    labels:
      - "diun.enable=true"

    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      POST: 0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - monitoring

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "diun.enable=true"

    ports:
      - "3000:3000"

    volumes:
      - ./:/app/config
      - ./public:/app/public/status:ro

    environment:
      HOMEPAGE_ALLOWED_HOSTS: "192.168.29.239:3000"

    env_file:
      - .env


    networks:
      - monitoring

    depends_on:
      - dockerproxy

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    restart: unless-stopped
    labels:
      - "diun.enable=true"

    environment:
      TZ: Asia/Kolkata
      LOG_LEVEL: info
      LOG_JSON: "false"

      DIUN_WATCH_SCHEDULE: "0 9 * * 6"
      DIUN_WATCH_JITTER: "30s"

      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_ENDPOINT: "tcp://dockerproxy:2375"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "false"

    volumes:
      - /home/san/server_data/diun:/data

    networks:
      - monitoring

    depends_on:
      - dockerproxy

networks:
  monitoring:
