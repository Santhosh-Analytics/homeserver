
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    labels:
      - "diun.enable=true"

    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      TZ: Asia/Kolkata

    volumes:
      - /home/san/server_data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
