services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3001:3000/tcp"

    volumes:
      - /home/san/server_data/adguard/work:/opt/adguardhome/work
      - /home/san/server_data/adguard/conf:/opt/adguardhome/conf

    labels:
      - "diun.enable=true"

