  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    labels:
      - "diun.enable=true"

    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:10200:10200"

    volumes:
      - /home/san/server_data/piper:/data

    command:
      - --voice
      - en_US-ryan-medium


# This must be at the root level (0 spaces of indentation)
networks:
  monitoring_net:
    external: true
