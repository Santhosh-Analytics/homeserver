services:
  whisper-en:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper-en
    restart: unless-stopped
    labels:
      - "diun.enable=true"

    ports:
      - "127.0.0.1:10300:10300"
    networks:
      - monitoring_net

    volumes:
      - /home/san/server_data/whisper:/data

    command:
      - --model
      - base-int8
      - --language
      - en
      - --cpu-threads
      - "4"
      - --beam-size
      - "8"
      - --vad-filter
      - --vad-min-silence-ms
      - "500"
      - --initial-prompt
      - "Home Assistant voice commands in Indian English. AC means air conditioner. Common \
         commands: turn on, turn off, switch on, switch off, set temperature, bedroom, \
         living room, downstairs, upstairs, kitchen, shopping list, add milk, bread, fan, \
         lights, timer set temperature, temperature, swing, turn on, turn off."


